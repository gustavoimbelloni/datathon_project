version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./app/model:/app/app/model
    command: python app/main.py

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      - api
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0

volumes:
  model_data:
